<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .container{
            border: 2px solid black;
            height: 500px;
            width: 850px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .card{
           background-color: white;
           border-radius: 8px;
           box-shadow: 0 4px 8px rgba(0,0,0,0.1);
           padding: 15px;
           width: 220px;
           text-align: center;
        }
        .avatar{
           width: 70px; height: 70px; 
           background: blue; 
           color: white; 
           border-radius: 50%; 
           display: flex; 
           justify-content: center; 
           align-items: center; 
           font-size: 20px; 
           margin: 0 auto 12px;
        }
        .name{
            font-size: 20px;
            font-weight: bold;
        }
        .detail{
            font-size: 14px;
            color: gray;
        }
    </style>
</head>
<body>

    <h2>Student Profile Cards</h2>

    <div class="container">

        <div class="card">
            <div class="avatar">JK</div>
            <div class="name">Jeet Kumar</div>
            <div class="detail">B.Tech - CSE</div>
            <div class="detail">Roll No: 21CS1007</div>
            <div class="detail">1st Year</div>
        </div>

        <div class="card">
            <div class="avatar">AR</div>
            <div class="name">Asha Rani</div>
            <div class="detail">B.Tech - IT</div>
            <div class="detail">Roll No: 21IT1012</div>
            <div class="detail">1st Year</div>
        </div>

        <div class="card">
            <div class="avatar">RK</div>
            <div class="name">Rohit Kumar</div>
            <div class="detail">B.Tech - ECE</div>
            <div class="detail">Roll No: 21EC1009</div>
            <div class="detail">1st Year</div>
        </div>

    </div>

</body>
</html>
